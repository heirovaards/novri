image: node:22-slim

stages:
  - verify

verify:
  stage: verify
  services:
    - name: postgres:17
      alias: db
  variables:
    POSTGRES_USER: lkps
    POSTGRES_PASSWORD: lkps
    POSTGRES_DB: lkps
    DATABASE_URL: postgres://lkps:lkps@db:5432/lkps
    TEST_DATABASE_URL: postgres://lkps:lkps@db:5432/lkps_test
    BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-for-production-use
    BETTER_AUTH_URL: http://localhost:3000
    PUBLIC_BASE_URL: http://localhost:3000
    STORAGE_DRIVER: local
    STORAGE_LOCAL_PATH: ./.data/uploads
    MAX_UPLOAD_MB: '5'
    SESSION_IDLE_MINUTES: '60'
    DEFAULT_PRODI_CODE: SI
    TZ: Asia/Jakarta
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile
  script:
    - pnpm db:migrate
    - pnpm db:seed
    - pnpm verify
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
