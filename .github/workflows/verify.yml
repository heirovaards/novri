name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: lkps
          POSTGRES_PASSWORD: lkps
          POSTGRES_DB: lkps
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lkps"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://lkps:lkps@localhost:5432/lkps
      TEST_DATABASE_URL: postgres://lkps:lkps@localhost:5432/lkps_test
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-for-production-use
      BETTER_AUTH_URL: http://localhost:3000
      PUBLIC_BASE_URL: http://localhost:3000
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: ./.data/uploads
      MAX_UPLOAD_MB: '5'
      SESSION_IDLE_MINUTES: '60'
      DEFAULT_PRODI_CODE: SI
      TZ: Asia/Jakarta

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:migrate

      - run: pnpm db:seed

      - run: pnpm verify
